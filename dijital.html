<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Yasin Yel">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#1d5fd6">
    <link rel="icon" href="ikon/ikon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="ikon/ikon-192.png">
    <title>Dijital Dedektif — Kodlayalım</title>
    <meta name="description" content="Sahte haberleri, gizli reklamları ve kişisel bilgi tuzaklarını yakala. Siber zorbalığa dur de, telif ve lisansları öğren.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="ortak.css">
    <style>
        main { padding: 28px 0 60px; }
        .intro h1 { font-size: clamp(1.8rem, 4vw, 2.4rem); }
        .intro p { color: var(--muted); margin-top: 6px; max-width: 720px; }
        .bol-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; margin-top: 24px; }
        .bol { padding: 20px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 6px; transition: transform .15s, border-color .15s; }
        .bol:hover { transform: translateY(-2px); border-color: var(--accent); }
        .bol .ik { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; color: #fff; font-size: 1.2rem; }
        .bol h3 { font-size: 1.2rem; }
        .bol p { color: var(--muted); font-size: .9rem; flex: 1; }
        .bol small { color: var(--accent); font-weight: 700; }

        .game-top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .game-top h2 { font-size: 1.25rem; flex: 1; }
        .dots { display: flex; gap: 6px; flex-wrap: wrap; }
        .dots span { width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
        .dots span.ok { background: var(--ok); } .dots span.cur { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
        .panel { padding: 22px; }
        .uyari { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; font-size: .92rem; margin-bottom: 16px; }

        .k { cursor: pointer; border-radius: 4px; transition: background .15s; }
        .bulmaca .k:hover { background: rgba(245, 180, 0, .25); }
        .k.bulundu { background: rgba(229, 72, 77, .18); outline: 2px solid var(--bad); outline-offset: 1px; }
        .k.bos { animation: titre .3s; }
        @keyframes titre { 0%,100% { translate: 0 } 33% { translate: -3px 0 } 66% { translate: 3px 0 } }
        .lnk { color: #1d5fd6; text-decoration: underline; font-weight: 600; }
        .durum-cubugu { font-family: var(--mono); font-size: .8rem; background: var(--bg-alt); color: var(--muted); padding: 6px 12px; min-height: 30px; border-top: 1px solid var(--line); }
        .karar { display: flex; gap: 10px; margin: 14px 0; flex-wrap: wrap; }
        .karar .btn { flex: 1; padding: 14px; font-size: 1rem; }
        .ipucu-listesi { list-style: none; display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .ipucu-listesi li { background: var(--bad-soft); border-radius: 10px; padding: 8px 12px; font-size: .92rem; }
        .ipucu-listesi li.gizli { background: var(--bg-alt); color: var(--muted); }
        .fb { font-weight: 600; min-height: 1.5em; margin-top: 10px; }
        .fb.ok { color: var(--ok); } .fb.bad { color: var(--bad); }

        /* Ne yapmalı */
        .durum-kart { max-width: 760px; margin: 0 auto; }
        .durum-kart .soru { font-size: 1.2rem; font-weight: 600; margin-bottom: 16px; line-height: 1.5; }
        .secenekler { display: flex; flex-direction: column; gap: 10px; }
        .secenekler button { text-align: left; padding: 14px 16px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); cursor: pointer; font-size: 1rem; font-weight: 600; }
        .secenekler button:hover { border-color: var(--accent); }
        .secenekler button.dogru { border-color: var(--ok); background: var(--ok-soft); }
        .secenekler button.yanlis { border-color: var(--bad); background: var(--bad-soft); opacity: .7; }
        .sonuc { text-align: center; padding: 36px 22px; max-width: 560px; margin: 0 auto; }
        .sonuc .big-stars { font-size: 2.6rem; margin: 12px 0; }
        .sonuc .actions { display: flex; gap: 10px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
        .dd { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 18px; align-items: start; }
        .haber { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface); }
        .haber .ubar { background: var(--bg-alt); padding: 8px 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); }
        .haber .ubar .adres { flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 5px 12px; font-family: var(--mono); font-size: .85rem; overflow-wrap: anywhere; }
        .haber .ic { padding: 18px 20px; }
        .haber .kaynak-ad { font-weight: 800; color: var(--accent); font-size: .85rem; text-transform: uppercase; letter-spacing: .05em; }
        .haber h3 { font-size: 1.35rem; margin: 6px 0 4px; line-height: 1.3; }
        .haber .tarih { color: var(--muted); font-size: .82rem; }
        .haber .gorsel { margin: 14px 0; background: var(--bg-alt); border-radius: 12px; height: 140px; display: grid; place-items: center; font-size: 4rem; position: relative; }
        .haber .gorsel small { position: absolute; bottom: 6px; left: 10px; right: 10px; font-size: .75rem; color: var(--muted); text-align: left; }
        .haber .metin { line-height: 1.75; }
        .post-bas { display: flex; align-items: center; gap: 10px; padding: 14px 16px 0; }
        .avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--bg-alt); display: grid; place-items: center; font-size: 1.4rem; flex: 0 0 auto; }
        .post-bas b { display: block; } .post-bas small { color: var(--muted); }
        .post-ust { font-size: .78rem; color: var(--muted); padding: 10px 16px 0; font-weight: 600; }
        .araclar { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--bg-alt); }
        .arac-sonuc { padding: 10px 16px; border-top: 1px dashed var(--line); font-size: .92rem; line-height: 1.6; }
        .arac-sonuc b { display: block; font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
        .iyi-liste { list-style: none; display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
        .iyi-liste li { background: var(--ok-soft); border-radius: 10px; padding: 8px 12px; font-size: .92rem; }
        .profil { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; }
        .profil .kapak { height: 70px; background: linear-gradient(120deg, #8b5cf6, #1d5fd6); }
        .profil .kimlik { display: flex; align-items: flex-end; gap: 12px; padding: 0 16px; margin-top: -28px; }
        .profil .kimlik .avatar { width: 64px; height: 64px; font-size: 2rem; border: 4px solid var(--surface); }
        .profil .bio { padding: 10px 16px 14px; border-bottom: 1px solid var(--line); line-height: 1.7; }
        .profil .gonderi { padding: 12px 16px; border-bottom: 1px solid var(--line); line-height: 1.7; }
        .profil .gonderi:last-child { border-bottom: 0; }
        .bulmaca .k:not(.bulundu):hover { background: rgba(245, 180, 0, .25); }
        .k.tamam-degil { background: var(--bg-alt); }
        .sohbet { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 14px; display: flex; flex-direction: column; gap: 8px; max-width: 760px; margin: 0 auto 16px; }
        .sohbet .bas { font-weight: 700; color: var(--muted); font-size: .85rem; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
        .msj { max-width: 85%; padding: 8px 12px; border-radius: 14px 14px 14px 4px; background: var(--bg-alt); }
        .msj small { display: block; font-weight: 700; font-size: .75rem; color: var(--accent); }
        .msj.ben { align-self: flex-end; border-radius: 14px 14px 4px 14px; background: var(--accent-soft); }
        .secenekler button.kismen { border-color: #f0c75e; background: rgba(255, 209, 102, .18); }
        .lisans-rehber { margin-bottom: 14px; }
        .lisans-rehber summary { cursor: pointer; font-weight: 700; padding: 12px 16px; }
        .lisans-rehber .liste { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; padding: 0 16px 16px; }
        .lisans-rehber .liste div { font-size: .85rem; color: var(--muted); }
        .rozet { display: inline-block; color: #fff; font-weight: 800; font-size: .72rem; padding: 3px 8px; border-radius: 6px; font-family: var(--mono); }
        .senaryo { font-size: 1.12rem; line-height: 1.5; margin-bottom: 14px; }
        .kaynaklar { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
        .kaynak { border: 2px solid var(--line); border-radius: 14px; padding: 14px; background: var(--surface); cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 6px; font: inherit; color: inherit; }
        .kaynak .em { font-size: 2.2rem; }
        .kaynak small { color: var(--muted); }
        .kaynak .sec { font-weight: 700; font-size: .85rem; color: var(--muted); }
        .kaynak.secili { border-color: var(--accent); background: var(--accent-soft); }
        .kaynak.secili .sec { color: var(--accent); }
        .kaynak.ok { border-color: var(--ok); } .kaynak.no { border-color: var(--bad); background: var(--bad-soft); }
        .kaynak .neden { font-size: .82rem; line-height: 1.45; }
        .sonuc { text-align: center; padding: 36px 22px; max-width: 560px; margin: 0 auto; }
        .sonuc .big-stars { font-size: 2.6rem; margin: 12px 0; }
        .sonuc .actions { display: flex; gap: 10px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
        @media (max-width: 900px) { .dd { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header class="kl-top">
        <div class="wrap kl-top-inner">
            <a href="./" class="kl-brand"><span class="kl-logo" aria-hidden="true"></span><span class="kl-ad"><b>Kod</b>layalım</span></a>
            <span class="kl-crumb"><i class="fas fa-chevron-right" style="font-size:.7em"></i><span>Dijital Dedektif</span></span>
            <span class="kl-spacer"></span>
            <button class="icon-btn" id="themeBtn" aria-label="Temayı değiştir"><i class="fas fa-circle-half-stroke"></i></button>
        </div>
    </header>

    <main class="wrap">
        <section id="liste">
            <div class="intro">
                <h1>Dijital Dedektif</h1>
                <p>İnternette gördüğün her şey doğru değil, her paylaşım masum değil. Dedektif büyüteçini al: sahte haberleri, gizli reklamları ve kişisel bilgi tuzaklarını yakala, çevrim içi dünyada iyi bir dijital vatandaş ol.</p>
            </div>
            <div class="bol-grid" id="bolumler"></div>
        </section>
        <section id="oyun" hidden>
            <div class="game-top">
                <button class="icon-btn" id="geri" aria-label="Geri"><i class="fas fa-arrow-left"></i></button>
                <h2 id="baslik"></h2>
                <div class="dots" id="dots"></div>
            </div>
            <div id="icerik"></div>
        </section>
        <section id="sonuc" hidden>
            <div class="card sonuc">
                <h2 id="sBaslik"></h2>
                <div class="big-stars" id="sYildiz"></div>
                <p id="sMetin" style="color:var(--muted)"></p>
                <div class="actions">
                    <button class="btn" id="sListe">Bölümler</button>
                    <button class="btn btn-primary" id="sTekrar"><i class="fas fa-rotate-left"></i> Tekrar</button>
                </div>
            </div>
        </section>
    </main>

    <script src="ortak.js"></script>
    <script src="dijital-motor.js"></script>
    <script src="dijital.js"></script>
</body>
</html>
