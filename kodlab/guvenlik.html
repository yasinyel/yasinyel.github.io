<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Yasin Yel">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#1d5fd6">
    <link rel="icon" href="ikon/ikon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="ikon/ikon-192.png">
    <title>Şifre Kalesi — Kodlayalım</title>
    <meta name="description" content="Şifre gücünü ölç, oltalama mesajlarını yakala, internette güvende kalmayı öğren.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="ortak.css">
    <style>
        main { padding: 28px 0 60px; }
        .intro h1 { font-size: clamp(1.8rem, 4vw, 2.4rem); }
        .intro p { color: var(--muted); margin-top: 6px; max-width: 720px; }
        .bol-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; margin-top: 24px; }
        .bol { padding: 20px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 6px; transition: transform .15s, border-color .15s; }
        .bol:hover { transform: translateY(-2px); border-color: var(--accent); }
        .bol .ik { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; color: #fff; font-size: 1.2rem; }
        .bol h3 { font-size: 1.2rem; }
        .bol p { color: var(--muted); font-size: .9rem; flex: 1; }
        .bol small { color: var(--accent); font-weight: 700; }

        .game-top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .game-top h2 { font-size: 1.25rem; flex: 1; }
        .dots { display: flex; gap: 6px; flex-wrap: wrap; }
        .dots span { width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
        .dots span.ok { background: var(--ok); } .dots span.cur { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
        .panel { padding: 22px; }
        .uyari { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; font-size: .92rem; margin-bottom: 16px; }

        /* Laboratuvar */
        .lab { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 18px; align-items: start; }
        .sifre-in { display: flex; gap: 8px; }
        .sifre-in input { flex: 1; min-width: 0; font-family: var(--mono); font-size: 1.3rem; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); }
        .sifre-in input:focus { outline: none; border-color: var(--accent); }
        .metre { height: 14px; background: var(--bg-alt); border-radius: 99px; overflow: hidden; margin: 16px 0 6px; }
        .metre div { height: 100%; border-radius: 99px; transition: width .3s, background .3s; }
        .seviye { display: flex; justify-content: space-between; font-weight: 700; }
        .sure { font-family: var(--display); font-size: 1.5rem; margin-top: 12px; }
        .sure small { display: block; font-family: var(--body); font-size: .85rem; color: var(--muted); font-weight: 500; }
        .parcalar { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
        .parca { font-family: var(--mono); padding: 4px 8px; border-radius: 8px; font-size: .9rem; display: flex; flex-direction: column; align-items: center; }
        .parca small { font-family: var(--body); font-size: .68rem; font-weight: 700; opacity: .8; }
        .parca.kelime { background: #fee2e2; color: #991b1b; } .parca.yil { background: #ffedd5; color: #9a3412; } .parca.sira { background: #fef3c7; color: #92400e; }
        .parca.tekrar { background: #fef3c7; color: #92400e; } .parca.yaygin { background: #fee2e2; color: #991b1b; } .parca.karakter { background: #dcfce7; color: #166534; }
        .kontrol-liste { list-style: none; display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
        .kontrol-liste li { display: flex; gap: 8px; align-items: center; }
        .kontrol-liste .fa-check { color: var(--ok); } .kontrol-liste .fa-xmark { color: var(--muted); }
        .gorevler { display: flex; flex-direction: column; gap: 10px; }
        .gorev { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; }
        .gorev.tamam { border-color: var(--ok); background: var(--ok-soft); }
        .gorev i { margin-top: 3px; color: var(--muted); } .gorev.tamam i { color: var(--ok); }
        .ipucu-kutu { margin-top: 14px; font-size: .92rem; color: var(--muted); }

        /* Hangisi güçlü */
        .cift { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 18px 0; }
        .cift button { padding: 22px 14px; border-radius: 16px; border: 2px solid var(--line); background: var(--surface); cursor: pointer; font-family: var(--mono); font-size: 1.15rem; word-break: break-all; display: flex; flex-direction: column; gap: 8px; align-items: center; }
        .cift button:hover { border-color: var(--accent); }
        .cift button small { font-family: var(--body); font-size: .85rem; color: var(--muted); }
        .cift button.dogru { border-color: var(--ok); background: var(--ok-soft); }
        .cift button.yanlis { border-color: var(--bad); background: var(--bad-soft); }

        /* Oltalama */
        .olta { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 18px; align-items: start; }
        .mesaj { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface); }
        .mesaj .bas { background: var(--bg-alt); padding: 12px 16px; font-size: .92rem; display: flex; flex-direction: column; gap: 4px; }
        .mesaj .bas b { color: var(--muted); font-weight: 600; margin-right: 6px; }
        .mesaj .govde { padding: 18px; line-height: 1.75; }
        .tarayici .adres { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px; font-family: var(--mono); font-size: .9rem; }
        .telefon { max-width: 380px; margin: 0 auto; border: 10px solid #111827; border-radius: 34px; background: var(--bg); padding: 14px 12px 40px; }
        .telefon .kimden { text-align: center; font-weight: 700; padding-bottom: 10px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
        .telefon .balon { background: var(--bg-alt); border-radius: 18px 18px 18px 4px; padding: 12px 14px; line-height: 1.6; }
        .sitebody { padding: 22px; text-align: center; line-height: 2; }
        .sitebody .alanlar { display: inline-block; text-align: left; background: var(--bg-alt); border-radius: 12px; padding: 12px 18px; margin: 10px 0; }
        .k { cursor: pointer; border-radius: 4px; transition: background .15s; }
        .bulmaca .k:hover { background: rgba(245, 180, 0, .25); }
        .k.bulundu { background: rgba(229, 72, 77, .18); outline: 2px solid var(--bad); outline-offset: 1px; }
        .k.bos { animation: titre .3s; }
        @keyframes titre { 0%,100% { translate: 0 } 33% { translate: -3px 0 } 66% { translate: 3px 0 } }
        .lnk { color: #1d5fd6; text-decoration: underline; font-weight: 600; }
        .durum-cubugu { font-family: var(--mono); font-size: .8rem; background: var(--bg-alt); color: var(--muted); padding: 6px 12px; min-height: 30px; border-top: 1px solid var(--line); }
        .karar { display: flex; gap: 10px; margin: 14px 0; flex-wrap: wrap; }
        .karar .btn { flex: 1; padding: 14px; font-size: 1rem; }
        .ipucu-listesi { list-style: none; display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .ipucu-listesi li { background: var(--bad-soft); border-radius: 10px; padding: 8px 12px; font-size: .92rem; }
        .ipucu-listesi li.gizli { background: var(--bg-alt); color: var(--muted); }
        .fb { font-weight: 600; min-height: 1.5em; margin-top: 10px; }
        .fb.ok { color: var(--ok); } .fb.bad { color: var(--bad); }

        /* Ne yapmalı */
        .durum-kart { max-width: 760px; margin: 0 auto; }
        .durum-kart .soru { font-size: 1.2rem; font-weight: 600; margin-bottom: 16px; line-height: 1.5; }
        .secenekler { display: flex; flex-direction: column; gap: 10px; }
        .secenekler button { text-align: left; padding: 14px 16px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); cursor: pointer; font-size: 1rem; font-weight: 600; }
        .secenekler button:hover { border-color: var(--accent); }
        .secenekler button.dogru { border-color: var(--ok); background: var(--ok-soft); }
        .secenekler button.yanlis { border-color: var(--bad); background: var(--bad-soft); opacity: .7; }
        .sonuc { text-align: center; padding: 36px 22px; max-width: 560px; margin: 0 auto; }
        .sonuc .big-stars { font-size: 2.6rem; margin: 12px 0; }
        .sonuc .actions { display: flex; gap: 10px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
        @media (max-width: 900px) { .lab, .olta { grid-template-columns: 1fr; } }
        @media (max-width: 560px) { .cift { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header class="kl-top">
        <div class="wrap kl-top-inner">
            <a href="./" class="kl-brand"><span class="kl-logo" aria-hidden="true"></span><span class="kl-ad"><b>Kod</b>layalım</span></a>
            <span class="kl-crumb"><i class="fas fa-chevron-right" style="font-size:.7em"></i><span>Şifre Kalesi</span></span>
            <span class="kl-spacer"></span>
            <button class="icon-btn" id="themeBtn" aria-label="Temayı değiştir"><i class="fas fa-circle-half-stroke"></i></button>
        </div>
    </header>

    <main class="wrap">
        <section id="liste">
            <div class="intro">
                <h1>Şifre Kalesi</h1>
                <p>Bilgilerin bir kalenin içindeki hazine gibidir. Şifren kalenin kapısı, oltalama mesajları ise kapıyı sana açtırmaya çalışan hilekârlardır. Kaleni koru!</p>
            </div>
            <div class="bol-grid" id="bolumler"></div>
        </section>
        <section id="oyun" hidden>
            <div class="game-top">
                <button class="icon-btn" id="geri" aria-label="Geri"><i class="fas fa-arrow-left"></i></button>
                <h2 id="baslik"></h2>
                <div class="dots" id="dots"></div>
            </div>
            <div id="icerik"></div>
        </section>
        <section id="sonuc" hidden>
            <div class="card sonuc">
                <h2 id="sBaslik"></h2>
                <div class="big-stars" id="sYildiz"></div>
                <p id="sMetin" style="color:var(--muted)"></p>
                <div class="actions">
                    <button class="btn" id="sListe">Bölümler</button>
                    <button class="btn btn-primary" id="sTekrar"><i class="fas fa-rotate-left"></i> Tekrar</button>
                </div>
            </div>
        </section>
    </main>

    <script src="ortak.js"></script>
    <script src="guvenlik-motor.js"></script>
    <script src="guvenlik.js"></script>
</body>
</html>
