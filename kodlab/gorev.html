<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#1d5fd6">
    <link rel="icon" href="ikon/ikon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="ikon/ikon-192.png">
    <title>Görev — KodLab</title>
    <meta name="description" content="Öğretmeninin verdiği KodLab görevi.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="ortak.css">
    <style>
        main { padding: 28px 0 60px; max-width: 820px; display: flex; flex-direction: column; gap: 18px; }
        .card { padding: 24px; }
        .kicker { color: var(--accent); font-weight: 700; font-size: .85rem; text-transform: uppercase; letter-spacing: .06em; }
        h1 { font-size: clamp(1.7rem, 4vw, 2.3rem); margin-top: 4px; }
        .from { color: var(--muted); margin-top: 4px; }
        .ilerleme { margin-top: 16px; height: 12px; background: var(--bg-alt); border-radius: 99px; overflow: hidden; }
        .ilerleme div { height: 100%; background: var(--ok); border-radius: 99px; transition: width .5s; }
        .liste { display: flex; flex-direction: column; gap: 10px; }
        .parca { display: flex; align-items: center; gap: 14px; padding: 14px; border: 1px solid var(--line); border-radius: 14px; }
        .parca .ik { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; color: #fff; flex: 0 0 auto; font-size: 1.2rem; }
        .parca .bilgi { flex: 1; min-width: 0; }
        .parca b { display: block; }
        .parca small { color: var(--muted); }
        .mini { height: 6px; background: var(--bg-alt); border-radius: 99px; overflow: hidden; margin-top: 6px; }
        .mini div { height: 100%; background: var(--ok); }
        .parca.tamam { border-color: var(--ok); background: var(--ok-soft); }
        .form { display: grid; grid-template-columns: 2fr 1fr auto; gap: 10px; align-items: end; }
        .form label { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; font-weight: 600; color: var(--muted); }
        input.in { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font-size: 1rem; }
        .teslim { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center; }
        .teslim .qr { background: #fff; padding: 8px; border-radius: 12px; line-height: 0; border: 1px solid var(--line); }
        .teslim textarea { width: 100%; height: 80px; font-family: var(--mono); font-size: .78rem; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); resize: none; word-break: break-all; }
        .hata { text-align: center; color: var(--muted); }
        @media (max-width: 640px) { .form { grid-template-columns: 1fr; } .teslim { grid-template-columns: 1fr; justify-items: center; } }
    </style>
</head>
<body>
    <header class="kl-top">
        <div class="wrap kl-top-inner">
            <a href="./" class="kl-brand"><span class="kl-logo">&lt;/&gt;</span>KodLab</a>
            <span class="kl-crumb"><i class="fas fa-chevron-right" style="font-size:.7em"></i><span>Görev</span></span>
            <span class="kl-spacer"></span>
            <button class="icon-btn" id="themeBtn" aria-label="Temayı değiştir"><i class="fas fa-circle-half-stroke"></i></button>
        </div>
    </header>

    <main class="wrap" id="ana">
        <section class="card">
            <span class="kicker"><i class="fas fa-clipboard-list"></i> Görev</span>
            <h1 id="baslik"></h1>
            <p class="from" id="kimden"></p>
            <div class="ilerleme"><div id="bar"></div></div>
            <p class="from" id="ozet" style="margin-top:6px"></p>
        </section>

        <section class="card" id="profilKart" hidden>
            <h2 style="font-size:1.15rem;margin-bottom:12px">Önce kendini tanıt</h2>
            <form class="form" id="form">
                <label>Adın ve soyadın <input class="in" id="ad" required maxlength="40"></label>
                <label>Sınıf / şube <input class="in" id="sinif" placeholder="7-B" maxlength="10"></label>
                <button class="btn btn-primary">Kaydet</button>
            </form>
        </section>

        <section class="card">
            <h2 style="font-size:1.15rem;margin-bottom:12px">Yapılacaklar</h2>
            <div class="liste" id="liste"></div>
        </section>

        <section class="card">
            <h2 style="font-size:1.15rem;margin-bottom:6px"><i class="fas fa-paper-plane" style="color:var(--accent)"></i> Teslim et</h2>
            <p class="from" id="teslimAciklama" style="margin-bottom:14px"></p>
            <div class="teslim">
                <div class="qr" id="qr"></div>
                <div>
                    <textarea id="kod" readonly aria-label="Teslim kodu"></textarea>
                    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
                        <button class="btn btn-primary btn-sm" id="kopyala"><i class="fas fa-copy"></i> Kodu kopyala</button>
                        <button class="btn btn-sm" id="paylas" hidden><i class="fas fa-share-nodes"></i> Paylaş</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="ortak.js"></script>
    <script src="qr.js"></script>
    <script src="katalog.js"></script>
    <script>
        (function () {
            const K = window.Katalog;
            const $ = (id) => document.getElementById(id);
            const kod = (location.hash.match(/g=([A-Za-z0-9_-]+)/) || [])[1];
            const g = kod && K.gorevCoz(kod);
            if (!g || !Array.isArray(g.p)) {
                $('ana').innerHTML = '<section class="card hata"><h1>Görev bulunamadı</h1><p>Bu bağlantı eksik ya da hatalı görünüyor. Öğretmeninden bağlantıyı tekrar iste.</p><p style="margin-top:14px"><a class="btn" href="./">KodLab ana sayfası</a></p></section>';
                return;
            }
            // Görevi profile ekle
            const gorevler = KL.oku('gorevler', []);
            if (!gorevler.some(x => x.i === g.i)) { gorevler.unshift({ i: g.i, b: g.b, p: g.p, kod }); KL.yaz('gorevler', gorevler.slice(0, 20)); }

            let profil = KL.oku('profil', {});
            $('baslik').textContent = g.b;
            $('kimden').textContent = g.o ? `${g.o} tarafından verildi` : '';
            document.title = g.b + ' — KodLab';

            function ciz() {
                $('profilKart').hidden = !!profil.ad;
                const parcalar = g.p.map(K.parca).filter(Boolean);
                let biten = 0, toplam = 0;
                $('liste').innerHTML = parcalar.map(p => {
                    const y = p.yildiz(), b = y.filter(x => x > 0).length;
                    biten += b; toplam += p.seviye;
                    const tamam = b === p.seviye;
                    return `<div class="parca ${tamam ? 'tamam' : ''}">
                        <span class="ik" style="background:${p.etkinlik.renk}"><i class="fas ${p.etkinlik.ikon}"></i></span>
                        <span class="bilgi"><b>${p.etkinlik.parcalar.length > 1 ? p.etkinlik.ad + ' · ' + p.ad : p.ad}</b>
                        <small>${b}/${p.seviye} bölüm · ${y.reduce((a, c) => a + c, 0)} yıldız</small><div class="mini"><div style="width:${b / p.seviye * 100}%"></div></div></span>
                        <a class="btn btn-sm ${tamam ? '' : 'btn-primary'}" href="${p.url}">${tamam ? 'Tekrar' : b ? 'Devam et' : 'Başla'}</a></div>`;
                }).join('');
                $('bar').style.width = (biten / toplam * 100) + '%';
                $('ozet').textContent = biten === toplam ? 'Bütün bölümler tamam! Şimdi teslim edebilirsin.' : `${toplam} bölümden ${biten} tanesi tamam.`;
                $('teslimAciklama').textContent = biten === toplam
                    ? 'Tebrikler! Bu kodu ya da QR kodu öğretmenine göster.'
                    : 'Görev bitmemiş olsa da şimdiye kadarki ilerlemeni gönderebilirsin.';
                const k = K.raporOlustur(profil, g.i);
                $('kod').value = k;
                $('qr').innerHTML = QR.svg(k, 180);
            }
            $('form').addEventListener('submit', (e) => {
                e.preventDefault();
                profil = { ...profil, ad: $('ad').value.trim(), sinif: $('sinif').value.trim().toLocaleUpperCase('tr') };
                KL.yaz('profil', profil);
                ciz();
            });
            $('kopyala').addEventListener('click', async () => {
                if (!profil.ad) { KL.bildir('Önce adını yaz.'); $('ad').focus(); return; }
                try { await navigator.clipboard.writeText($('kod').value); KL.bildir('Kopyalandı! Öğretmenine gönder.'); }
                catch (e) { $('kod').select(); KL.bildir('Ctrl+C ile kopyala.'); }
            });
            if (navigator.share) {
                $('paylas').hidden = false;
                $('paylas').addEventListener('click', () => navigator.share({ title: g.b, text: `${profil.ad || ''} – ${g.b}\n${$('kod').value}` }).catch(() => {}));
            }
            ciz();
        })();
    </script>
</body>
</html>
