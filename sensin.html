<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilgisayar Sensin — KodLab</title>
    <meta name="description" content="Kodu oku, bilgisayarın yerine sen çalıştır: karakteri yön tuşlarıyla kodun söylediği gibi hareket ettir.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="ortak.css">
    <style>
        main { padding: 28px 0 60px; }
        .intro h1 { font-size: clamp(1.8rem, 4vw, 2.4rem); }
        .intro p { color: var(--muted); margin-top: 6px; max-width: 720px; }
        .kademeler { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 24px; }
        .kademe { padding: 18px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 6px; border-width: 2px; transition: transform .15s; }
        .kademe:hover { transform: translateY(-2px); }
        .kademe.sel { border-color: var(--kc); box-shadow: 0 0 0 4px color-mix(in srgb, var(--kc) 20%, transparent); }
        .kademe .ik { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: #fff; background: var(--kc); font-size: 1.1rem; }
        .kademe h3 { font-size: 1.2rem; margin-top: 4px; }
        .kademe small { color: var(--kc); font-weight: 700; }
        .kademe p { color: var(--muted); font-size: .88rem; }
        .kademe .bar { height: 6px; background: var(--bg-alt); border-radius: 99px; overflow: hidden; margin-top: 6px; }
        .kademe .bar div { height: 100%; background: var(--kc); }
        .bolumler { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin-top: 22px; }
        .bolum { padding: 14px; text-align: left; cursor: pointer; display: flex; gap: 12px; align-items: center; }
        .bolum:disabled { opacity: .45; cursor: not-allowed; }
        .bolum:hover:not(:disabled) { border-color: var(--accent); }
        .bolum .no { width: 36px; height: 36px; flex: 0 0 auto; border-radius: 10px; display: grid; place-items: center; background: var(--bg-alt); font-weight: 800; font-family: var(--display); }
        .bolum.done .no { background: var(--ok-soft); color: var(--ok); }
        .bolum b { display: block; font-size: .95rem; }
        .bolum .stars { font-size: .7rem; }

        .game-top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
        .game-top h2 { font-size: 1.2rem; flex: 1; min-width: 200px; }
        .game-top h2 small { display: block; font-family: var(--body); font-size: .8rem; color: var(--muted); font-weight: 600; }
        .meta { display: flex; gap: 14px; align-items: center; font-weight: 600; color: var(--muted); font-size: .92rem; }
        .meta b { color: var(--ink); font-family: var(--mono); }
        .play { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
        .code-card { padding: 18px; }
        .code-card h3 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-family: var(--body); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .yeni { background: var(--ok-soft); color: var(--ink); padding: 10px 14px; border-radius: 12px; font-size: .92rem; margin-bottom: 12px; }
        .yeni b { color: var(--ok); }

        /* Metin kod */
        pre.code { background: var(--code-bg); color: var(--code-ink); font-family: var(--mono); font-size: 16px; line-height: 1.7; padding: 16px 0; border-radius: 14px; overflow-x: auto; border: 1px solid var(--line); }
        pre.code .ln { display: block; padding: 0 18px 0 0; border-left: 3px solid transparent; }
        pre.code .ln::before { content: attr(data-n); display: inline-block; width: 2.4em; margin-right: 12px; color: #4a5875; text-align: right; }
        pre.code .ln.cur { background: rgba(255, 209, 102, .14); border-left-color: #ffd166; }
        .k { color: #c792ea; } .f { color: #82aaff; } .s { color: #c3e88d; } .n { color: #f78c6c; }

        /* Bloklar (ilkokul) */
        .bloklar { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
        .blk { border-radius: 10px; font-weight: 700; color: #fff; }
        .blk.mv { padding: 9px 14px; font-size: 1.05rem; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); }
        .blk.mv b { font-size: 1.2rem; margin-right: 4px; }
        .blk.rep { background: #f59e0b; padding: 0 0 0 0; display: flex; flex-direction: column; box-shadow: inset 0 -3px 0 rgba(0,0,0,.15); }
        .rep-head { padding: 8px 14px; }
        .rep-body { margin-left: 18px; padding: 6px 8px 6px 8px; background: var(--surface); border-radius: 8px 0 0 8px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
        .rep-foot { height: 12px; }
        .blk.cur, .ok.cur { outline: 4px solid #ffd166; outline-offset: 2px; }
        .dR { background: #16a36a; } .dL { background: #f97316; } .dU { background: #1d5fd6; } .dD { background: #8b5cf6; }

        /* Oklar (okul öncesi) */
        .oklar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        .ok { width: 62px; height: 62px; border-radius: 16px; display: grid; place-items: center; color: #fff; font-size: 2.2rem; font-weight: 800; box-shadow: inset 0 -4px 0 rgba(0,0,0,.18); transition: transform .15s; }
        .ok.cur { transform: scale(1.1); }
        .okrep { display: inline-flex; align-items: center; gap: 8px; padding: 8px; border: 4px dashed #f59e0b; border-radius: 20px; position: relative; }
        .okrep-in { display: flex; gap: 8px; }
        .okrep-n { background: #f59e0b; color: #fff; font-family: var(--display); font-weight: 800; font-size: 1.6rem; padding: 4px 12px; border-radius: 12px; }

        /* Tahta */
        .board-card { padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
        .board-wrap { background: var(--bg-alt); border-radius: 14px; padding: 16px; width: 100%; display: grid; place-items: center; overflow: hidden; }
        .board { position: relative; display: grid; }
        .cell { width: var(--c); height: var(--c); background: var(--tile); box-shadow: inset 0 0 0 1px var(--tile-line); position: relative; }
        .cell.iz::after { content: ''; position: absolute; inset: 30%; border-radius: 50%; background: color-mix(in srgb, var(--accent) 45%, transparent); }
        .cell.bas::before { content: '\f024'; font-family: 'Font Awesome 6 Free'; font-weight: 900; position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: calc(var(--c) * .35); opacity: .6; }
        .cell.yanlis { animation: yanlis .5s; }
        @keyframes yanlis { 0%, 100% { background: var(--tile); } 30% { background: var(--bad-soft); box-shadow: inset 0 0 0 3px var(--bad); } }
        .karakter { position: absolute; left: 0; top: 0; width: var(--c); height: var(--c); transition: transform .14s ease-out; z-index: 2; pointer-events: none; padding: 3px; }
        .karakter svg { width: 100%; height: 100%; }
        .karakter.sars svg { animation: sars .35s; }
        @keyframes sars { 0%,100% { translate: 0 } 25% { translate: -5px 0 } 75% { translate: 5px 0 } }

        /* Ok tuşları */
        .pad { display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(2, 64px); gap: 8px; }
        .pad button { border: 0; border-radius: 16px; font-size: 1.7rem; color: #fff; cursor: pointer; box-shadow: inset 0 -4px 0 rgba(0,0,0,.2); touch-action: manipulation; transition: transform .08s; }
        .pad button:active, .pad button.bas { transform: translateY(2px) scale(.96); }
        .pad button.hata { animation: sars .3s; background: var(--bad) !important; }
        .pad [data-d="U"] { grid-column: 2; }
        .pad [data-d="L"] { grid-column: 1; grid-row: 2; }
        .pad [data-d="D"] { grid-column: 2; grid-row: 2; }
        .pad [data-d="R"] { grid-column: 3; grid-row: 2; }
        .msg { min-height: 1.5em; font-weight: 600; text-align: center; color: var(--muted); }
        .msg.bad { color: var(--bad); }
        .msg.ok { color: var(--ok); }
        .tools { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

        @media (max-width: 980px) { .kademeler { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 860px) { .play { grid-template-columns: 1fr; } }
        @media (max-width: 520px) { .kademeler { grid-template-columns: 1fr; } .ok { width: 50px; height: 50px; font-size: 1.7rem; } }
    </style>
</head>
<body>
    <header class="kl-top">
        <div class="wrap kl-top-inner">
            <a href="./" class="kl-brand"><span class="kl-logo">&lt;/&gt;</span>KodLab</a>
            <span class="kl-crumb"><i class="fas fa-chevron-right" style="font-size:.7em"></i><span>Bilgisayar Sensin</span></span>
            <span class="kl-spacer"></span>
            <button class="icon-btn" id="themeBtn" aria-label="Temayı değiştir"><i class="fas fa-circle-half-stroke"></i></button>
        </div>
    </header>

    <main class="wrap">
        <section id="liste">
            <div class="intro">
                <h1>Bilgisayar Sensin</h1>
                <p>Bu oyunda bilgisayar sensin! Ekrandaki kodu oku ve kodun söylediklerini <b>yön tuşlarıyla</b> sırayla yap. Kod çalışınca karakter nereye giderse sen de oraya götür. Yanlış tuşa basarsan karakter yerinden kıpırdamaz.</p>
            </div>
            <div class="kademeler" id="kademeler"></div>
            <div class="bolumler" id="bolumler"></div>
        </section>

        <section id="oyun" hidden>
            <div class="game-top">
                <button class="icon-btn" id="geri" aria-label="Bölümlere dön"><i class="fas fa-arrow-left"></i></button>
                <h2 id="baslik"></h2>
                <div class="meta">
                    <span title="Yapılan hamle"><i class="fas fa-shoe-prints"></i> <b id="ilerleme"></b></span>
                    <span title="Hatalar"><i class="fas fa-xmark" style="color:var(--bad)"></i> <b id="hatalar">0</b></span>
                </div>
            </div>
            <div class="play">
                <div class="card code-card">
                    <div class="yeni" id="yeni" hidden></div>
                    <h3><span id="kodBaslik">Kod</span>
                        <button class="btn btn-sm" id="ipucu"><i class="fas fa-lightbulb"></i> İpucu</button></h3>
                    <div id="kod"></div>
                </div>
                <div class="card board-card">
                    <div class="board-wrap" id="boardWrap"><div class="board" id="board"></div></div>
                    <div class="msg" id="msg" role="status"></div>
                    <div class="pad" id="pad" aria-label="Yön tuşları">
                        <button data-d="U" class="dU" aria-label="Yukarı">↑</button>
                        <button data-d="L" class="dL" aria-label="Sol">←</button>
                        <button data-d="D" class="dD" aria-label="Aşağı">↓</button>
                        <button data-d="R" class="dR" aria-label="Sağ">→</button>
                    </div>
                    <div class="tools">
                        <button class="btn btn-sm" id="bastan"><i class="fas fa-rotate-left"></i> Baştan başla</button>
                        <button class="btn btn-sm" id="yeniSoru"><i class="fas fa-shuffle"></i> Yeni sayılarla</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <dialog class="kl-dialog" id="kazandi">
        <h2 id="kTitle"></h2>
        <div class="big-stars" id="kStars"></div>
        <p id="kText"></p>
        <div class="actions">
            <button class="btn" id="kTekrar"><i class="fas fa-shuffle"></i> Yeni sayılarla</button>
            <button class="btn btn-primary" id="kSonraki">Sonraki bölüm <i class="fas fa-arrow-right"></i></button>
        </div>
    </dialog>

    <script src="ortak.js"></script>
    <script src="sensin-motor.js"></script>
    <script src="sensin.js"></script>
</body>
</html>
