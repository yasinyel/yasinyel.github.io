<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Yasin Yel">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#1d5fd6">
    <link rel="icon" href="ikon/ikon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="ikon/ikon-192.png">
    <title>Örüntü Bul — Kodlayalım</title>
    <meta name="description" content="Sıradaki ne? Okul öncesi ve ilkokul için örüntü etkinliği.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="ortak.css">
    <style>
        main { padding: 28px 0 60px; }
        .intro h1 { font-size: clamp(1.8rem, 4vw, 2.4rem); }
        .intro p { color: var(--muted); margin-top: 6px; max-width: 680px; }
        .lvl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-top: 24px; }
        .lvl-card { padding: 16px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 8px; transition: transform .15s, border-color .15s; }
        .lvl-card:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--accent); }
        .lvl-card:disabled { opacity: .5; cursor: not-allowed; }
        .lvl-card .no { font-family: var(--mono); color: var(--accent); font-size: .85rem; }
        .lvl-card h3 { font-size: 1.1rem; }
        .lvl-card .prev { font-size: 1.5rem; letter-spacing: 2px; display: flex; gap: 4px; align-items: center; flex-wrap: wrap; min-height: 34px; }
        .lvl-card .prev .sh { width: 26px; height: 26px; }

        .game-top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
        .game-top h2 { font-size: 1.2rem; flex: 1; }
        .dots { display: flex; gap: 6px; }
        .dots span { width: 14px; height: 14px; border-radius: 50%; background: var(--line); }
        .dots span.ok { background: var(--ok); }
        .dots span.cur { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
        .stage { padding: clamp(18px, 4vw, 36px); text-align: center; }
        .ask { font-size: 1.3rem; font-weight: 700; color: var(--muted); display: flex; justify-content: center; gap: 10px; align-items: center; }
        .seq { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(6px, 1.5vw, 12px); margin: 26px 0; }
        .item { width: clamp(48px, 9vw, 84px); height: clamp(48px, 9vw, 84px); border-radius: 18px; background: var(--bg-alt); display: grid; place-items: center; font-size: clamp(1.9rem, 5.5vw, 3.2rem); line-height: 1; }
        .item.q { border: 4px dashed var(--accent); background: var(--accent-soft); color: var(--accent); font-family: var(--display); font-weight: 800; }
        .item.q.dolu { border-style: solid; border-color: var(--ok); background: var(--ok-soft); animation: pop .4s; }
        @keyframes pop { 50% { transform: scale(1.18); } }
        .opts { display: flex; justify-content: center; gap: clamp(10px, 3vw, 24px); flex-wrap: wrap; }
        .opt { width: clamp(80px, 18vw, 120px); height: clamp(80px, 18vw, 120px); border-radius: 24px; border: 3px solid var(--line); background: var(--surface); font-size: clamp(2.6rem, 8vw, 4rem); cursor: pointer; display: grid; place-items: center; box-shadow: var(--shadow); transition: transform .1s, border-color .15s; }
        .opt:hover { border-color: var(--accent); transform: translateY(-3px); }
        .opt.hata { animation: sars .35s; border-color: var(--bad); opacity: .45; }
        @keyframes sars { 0%,100% { translate: 0 } 25% { translate: -8px 0 } 75% { translate: 8px 0 } }
        .sh { width: 70%; height: 70%; }
        .result { text-align: center; padding: 36px 22px; max-width: 560px; margin: 0 auto; }
        .result .big-stars { font-size: 3rem; margin: 12px 0; }
        .result .actions { display: flex; gap: 10px; justify-content: center; margin-top: 22px; flex-wrap: wrap; }
    </style>
</head>
<body>
    <header class="kl-top">
        <div class="wrap kl-top-inner">
            <a href="./" class="kl-brand"><span class="kl-logo" aria-hidden="true"></span><span class="kl-ad"><b>Kod</b>layalım</span></a>
            <span class="kl-crumb"><i class="fas fa-chevron-right" style="font-size:.7em"></i><span>Örüntü Bul</span></span>
            <span class="kl-spacer"></span>
            <button class="icon-btn" id="themeBtn" aria-label="Temayı değiştir"><i class="fas fa-circle-half-stroke"></i></button>
        </div>
    </header>

    <main class="wrap">
        <section id="liste">
            <div class="intro">
                <h1>Örüntü Bul</h1>
                <p>Sıralamada bir kural gizli! Kuralı bul ve soru işaretinin yerine ne gelmesi gerektiğini seç. Bilgisayarcılar da problemleri çözerken önce böyle tekrar eden kalıpları arar.</p>
            </div>
            <div class="lvl-grid" id="lvlGrid"></div>
        </section>

        <section id="oyun" hidden data-seslendir="Örüntüye dikkatle bak. Sırada hangisi gelir? Doğru olanı seç.">
            <div class="game-top">
                <button class="icon-btn" id="geri" aria-label="Geri"><i class="fas fa-arrow-left"></i></button>
                <h2 id="gTitle"></h2>
                <div class="dots" id="dots"></div>
            </div>
            <div class="card stage">
                <p class="ask"><i class="fas fa-circle-question" style="color:var(--accent)"></i> Soru işaretinin yerine hangisi gelir?</p>
                <div class="seq" id="seq"></div>
                <div class="opts" id="opts"></div>
                <div id="ipucuYer" style="margin-top:14px;text-align:center"></div>
            </div>
        </section>

        <section id="sonuc" hidden>
            <div class="card result">
                <h2 id="rTitle"></h2>
                <div class="big-stars" id="rStars"></div>
                <div class="actions">
                    <button class="btn" id="rList"><i class="fas fa-table-cells-large"></i> Seviyeler</button>
                    <button class="btn" id="rAgain"><i class="fas fa-rotate-left"></i> Tekrar</button>
                    <button class="btn btn-primary" id="rNext">Sonraki <i class="fas fa-arrow-right"></i></button>
                </div>
            </div>
        </section>
    </main>

    <script src="ortak.js"></script>
    <script src="oruntu.js"></script>
</body>
</html>
